name: Android CI/CD

on:
  push:
    branches: [ "main", "new" ]
    tags:
      - 'v*'
      - 'release*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KS_PATH="${{ runner.temp }}/release.jks"
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KS_PATH"
            if [ ! -s "$KS_PATH" ]; then
              echo "::error::Decoded keystore file is empty."
              exit 1
            fi
            keytool -list -keystore "$KS_PATH" -storepass:env KEYSTORE_PASSWORD >/dev/null
            echo "KEYSTORE_FILE=$KS_PATH" >> "$GITHUB_ENV"
            echo "Shared keystore prepared outside repository workspace."
          else
            echo "::warning::KEYSTORE_BASE64 secret is not set; builds will fall back cleanly where allowed."
          fi

      - name: Grant permission
        run: chmod +x gradlew

      - name: Generate Changelog
        run: |
          git log --pretty=format:"- %s" > CHANGELOG.txt

      - name: Auto Version Build & Telegram Notification
        id: build_step
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_THREAD_R_ID: ${{ secrets.TELEGRAM_THREAD_R_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python3 scripts/telegram_build.py

      - name: Create GitHub Release
        if: steps.build_step.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.build_step.outputs.tag_name }} (v${{ steps.build_step.outputs.version_name }})
          tag_name: ${{ steps.build_step.outputs.tag_name }}
          body_path: CHANGELOG.txt
          files: |
            ${{ steps.build_step.outputs.apk_path }}
            ${{ steps.build_step.outputs.aab_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Play Store Secret
        id: play_check
        if: steps.build_step.outputs.is_release == 'true'
        env:
          PLAY_SECRET: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SECRET" ]; then
            echo "has_play=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play=false" >> "$GITHUB_OUTPUT"
            echo "PLAY_STORE_SERVICE_ACCOUNT_JSON is not set; skipping Google Play upload."
          fi

      - name: Upload AAB to Google Play
        if: steps.build_step.outputs.is_release == 'true' && steps.play_check.outputs.has_play == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: glab.dragweb
          releaseFiles: ${{ steps.build_step.outputs.aab_path }}
          track: ${{ vars.PLAY_STORE_TRACK || 'internal' }}
          status: ${{ vars.PLAY_STORE_RELEASE_STATUS || 'completed' }}

      - name: Cleanup Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.jks"
