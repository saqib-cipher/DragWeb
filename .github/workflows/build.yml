name: Android CI/CD

on:
  push:
    branches: [ "main", "new" ]
    tags:
      - 'v*'
      - 'release*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository (with all tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 🔧 Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 🔐 Decode & Convert Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > $GITHUB_WORKSPACE/release_raw.jks
            keytool -importkeystore \
              -srckeystore $GITHUB_WORKSPACE/release_raw.jks \
              -destkeystore $GITHUB_WORKSPACE/release.jks \
              -deststoretype JKS \
              -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -srcalias "${{ secrets.KEY_ALIAS }}" \
              -destalias "${{ secrets.KEY_ALIAS }}" \
              -srckeypass "${{ secrets.KEY_PASSWORD }}" \
              -destkeypass "${{ secrets.KEY_PASSWORD }}" \
              -noprompt
            echo "✅ Keystore ready at $GITHUB_WORKSPACE/release.jks"
          fi

      - name: ⚙️ Grant permission
        run: chmod +x gradlew

      - name: 📝 Generate Changelog
        run: |
          git log --pretty=format:"- %s" > CHANGELOG.txt

      - name: 🏗️ Auto Version Build & Telegram Notification
        id: build_step
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          TELEGRAM_THREAD_R_ID: ${{ secrets.TELEGRAM_THREAD_R_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 scripts/telegram_build.py --log "build.log"

      # 🚀 Create GitHub Release if a new version code tag was created
      - name: 🚀 Create GitHub Release
        if: steps.build_step.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.build_step.outputs.tag_name }} (v${{ steps.build_step.outputs.version_name }})
          tag_name: ${{ steps.build_step.outputs.tag_name }}
          body_path: CHANGELOG.txt
          files: ${{ steps.build_step.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
