name: Android CI/CD

on:
  push:
    branches: [ "main", "new" ]
    tags:
      - 'release*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('source/**/*.gradle*', 'source/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 🔐 Decode & Convert Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > release_raw.jks

          keytool -importkeystore \
            -srckeystore release_raw.jks \
            -destkeystore release.jks \
            -deststoretype JKS \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -srckeypass "${{ secrets.KEY_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -noprompt

      - name: ⚙️ Grant permission
        run: chmod +x source/gradlew

      - name: 🏗️ Build APK
        run: |
          cd source
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # ✅ FIXED: Reliable APK detection + hard fail if missing
      - name: 🔍 Find & Copy APK
        run: |
          echo "=== Searching APK ==="
          APK_PATH=$(find source/app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)

          if [ ! -f "$APK_PATH" ]; then
            echo "❌ ERROR: APK not found"
            exit 1
          fi

          echo "✅ Found APK: $APK_PATH"
          cp "$APK_PATH" DragWeb-release.apk

          if [ ! -f "DragWeb-release.apk" ]; then
            echo "❌ ERROR: Copy failed"
            exit 1
          fi

          ls -lh DragWeb-release.apk

      - name: 📝 Generate Changelog
        run: git log --pretty=format:"- %s" > CHANGELOG.txt

      # ✅ FIXED: No env path, no empty artifact
      - name: 📤 Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragWeb-release
          path: DragWeb-release.apk
          retention-days: 30
          if-no-files-found: error

      # 📲 Send APK to Telegram on EVERY commit (branch pushes only)
      - name: 📲 Send APK to Telegram (Dev Build)
        if: github.ref_type == 'branch'
        run: |
          BRANCH="${{ github.ref_name }}"
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          CHANGELOG=$(cat CHANGELOG.txt | head -c 900)
          CAPTION=$(printf "*Dev Build*\n\n *Branch:* %s\n *Commit:* #%s\n\n*Changes:*\n%s" "$BRANCH" "$SHORT_SHA" "$CHANGELOG")

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
            -F document=@DragWeb-release.apk \
            -F caption="$CAPTION" \
            -F parse_mode="Markdown"

      # 🚀 GitHub Release — only on release tag
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/release')
        uses: softprops/action-gh-release@v2
        with:
          name: APK-${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          files: DragWeb-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 📲 Telegram Release Build — only on release tag
      - name: 📲 Upload APK to Telegram (Release)
        if: startsWith(github.ref, 'refs/tags/release')
        run: |
          VERSION="${{ github.ref_name }}"
          CHANGELOG=$(cat CHANGELOG.txt | head -c 900)
          CAPTION=$(printf "*New Release*\n\n*Version:* %s\n\n*Changes:*\n%s \n\n#%s" "$VERSION" "$CHANGELOG" "VERSION")

          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F document=@DragWeb-release.apk \
            -F caption="$CAPTION" \
            -F parse_mode="Markdown"
