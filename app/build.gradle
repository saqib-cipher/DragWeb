plugins {
    id 'com.android.application'
}

def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def resolvedStorePath = System.getenv("KEYSTORE_FILE") ?: keystoreProps.getProperty("storeFile")
def resolvedStorePass = System.getenv("KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def resolvedKeyAlias = System.getenv("KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def resolvedKeyPass = System.getenv("KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword") ?: resolvedStorePass

File resolvedStoreFileObj = null
if (resolvedStorePath != null && !resolvedStorePath.trim().isEmpty()) {
    File candidate = new File(resolvedStorePath.trim())
    resolvedStoreFileObj = candidate.isAbsolute() ? candidate : rootProject.file(resolvedStorePath.trim())
}

boolean hasCustomSigning = resolvedStoreFileObj != null
        && resolvedStoreFileObj.exists()
        && resolvedStorePass != null && !resolvedStorePass.isEmpty() && !resolvedStorePass.startsWith("YOUR_")
        && resolvedKeyAlias != null && !resolvedKeyAlias.isEmpty() && !resolvedKeyAlias.startsWith("YOUR_")
        && resolvedKeyPass != null && !resolvedKeyPass.isEmpty() && !resolvedKeyPass.startsWith("YOUR_")

android {
    namespace = "glab.dragweb"
    compileSdk = 37

    defaultConfig {
        applicationId = "glab.dragweb"
        minSdk = 26
        targetSdk = 37
        versionCode = 6
        versionName = "1.4"
    }

    signingConfigs {
        if (hasCustomSigning) {
            shared {
                storeFile resolvedStoreFileObj
                storePassword resolvedStorePass
                keyAlias resolvedKeyAlias
                keyPassword resolvedKeyPass
            }
        }
    }

    buildTypes {
        debug {
            if (hasCustomSigning) {
                signingConfig signingConfigs.shared
            }
        }
        release {
            if (hasCustomSigning) {
                signingConfig signingConfigs.shared
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/license.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/notice.txt',
                'META-INF/ASL2.0',
                'META-INF/*.kotlin_module'
            ]
        }
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'org.mozilla:rhino:1.7.15'
    testImplementation 'junit:junit:4.13.2'
}
